<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141923">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VARcel 60">
  <meta name="description" content="De officiële kaarten van Marcel. 60 jaar. Altijd gelijk. Nooit buitenspel.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>VARcel 60</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}body{background:#141923;color:white;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    #home{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(30px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));text-align:center}
    h1{font-size:clamp(2rem,9vw,3rem);margin:0;font-weight:800;letter-spacing:-.04em}p{margin:0;color:#b7c0cf;font-size:1rem}
    .subtitle{font-size:.9rem;color:#e8c877}.choices{display:flex;gap:16px;width:min(100%,440px);margin-top:14px}.choice{flex:1;min-height:160px;border:0;border-radius:22px;font-size:1.4rem;font-weight:850;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 25px #0004}
    .yellow{background:#ffdf00;color:#171717}.red{background:#f00018;color:#fff}.hint{font-size:.85rem;max-width:330px;line-height:1.5}
    #card{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;z-index:10}
    #card.active{display:block}#card.yellow{background:#ffdf00}#card.red{background:#f00018}
    .choice:focus-visible,#card:focus-visible{outline:4px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main id="home">
    <div aria-hidden="true" style="font-size:3rem">🟨 🟥</div>
    <h1>VARcel 60</h1>
    <p>60 jaar. Altijd gelijk. Nooit buitenspel.</p>
    <p class="subtitle">De officiële kaarten van Marcel</p>
    <div class="choices">
      <button class="choice yellow" data-color="yellow" type="button">GEEL</button>
      <button class="choice red" data-color="red" type="button">ROOD</button>
    </div>
    <p class="hint">Tik op de kaart om terug te gaan.</p>
  </main>
  <button id="card" type="button" aria-label="Tik om terug te gaan naar kaartkeuze"></button>
  <script>
    const card=document.getElementById('card');
    const home=document.getElementById('home');
    function showCard(color){card.className='active '+color;card.setAttribute('aria-label',(color==='yellow'?'Gele':'Rode')+' kaart. Tik om terug te gaan.');home.hidden=true;document.querySelector('meta[name="theme-color"]').content=color==='yellow'?'#ffdf00':'#f00018';}
    function back(){card.className='';home.hidden=false;document.querySelector('meta[name="theme-color"]').content='#141923';}
    document.querySelectorAll('[data-color]').forEach(btn=>btn.addEventListener('click',()=>showCard(btn.dataset.color)));
    card.addEventListener('click',back);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&card.classList.contains('active'))back();});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
